[project]
name = "home-assistant-nitrado-gameserver-validation"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
test = [
    "bandit==1.9.4",
    "pytest==9.0.3",
    "pytest-homeassistant-custom-component==0.13.356",
    "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"custom_components/nitrado_gameserver/config_flow.py" = ["BLE001"]
"custom_components/nitrado_gameserver/coordinator.py" = ["BLE001"]
"custom_components/nitrado_gameserver/editable_files.py" = ["BLE001"]
"custom_components/nitrado_gameserver/entity.py" = ["BLE001"]
"custom_components/nitrado_gameserver/views.py" = ["BLE001"]
"tests/*" = ["B017", "RUF012"]
