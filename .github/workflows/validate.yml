name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 10 * * 2"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22.19.0"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv lock --check
      - run: python3 -B scripts/validate_public_repository.py . --require-clean --allow-remote
      - run: uv sync --frozen --group test --no-install-project
      - run: uv venv --python "$PYTHON_VERSION" .venv-unit
      - run: PYTHONDONTWRITEBYTECODE=1 .venv-unit/bin/python -B -m unittest discover -s tests -q
      - run: .venv/bin/ruff check --no-cache custom_components tests ha_tests scripts
      - run: .venv/bin/ruff format --check --no-cache custom_components tests ha_tests scripts
      - run: .venv/bin/bandit -q -r custom_components/nitrado_gameserver -x custom_components/nitrado_gameserver/frontend
      - run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m compileall -q custom_components tests ha_tests scripts
      - run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -p no:cacheprovider -q ha_tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --check custom_components/nitrado_gameserver/frontend/nitrado-game-server-panel.js
      - run: node --check custom_components/nitrado_gameserver/frontend/palworld-cockpit.js
      - run: npm run test:frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-acceptance-output
          path: browser_tests/output/
          if-no-files-found: ignore
          retention-days: 7

  release-artifact:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Restore annotated release tag object
        run: >-
          git fetch --force --no-tags origin
          "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - run: python3 scripts/verify_release_provenance.py --root . --tag "${GITHUB_REF_NAME}" --output dist
      - run: scripts/build_release_artifact.sh 'dist/release-{version}-ci'
      - run: python3 dist/release-*/scripts/validate_release_artifact.py dist/release-*
      - run: >-
          python3 scripts/verify_local_hacs_lifecycle.py
          --archive "dist/home-assistant-nitrado-gameserver-${GITHUB_REF_NAME}.tar.gz"
          --artifact "dist/release-${GITHUB_REF_NAME}-ci"

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate private-repository HACS contract
        if: github.event.repository.private == true
        run: python3 -B -m unittest tests.test_publication_tools.HacsManifestContractTests
      - name: Validate public repository with HACS
        if: github.event.repository.private == false
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
